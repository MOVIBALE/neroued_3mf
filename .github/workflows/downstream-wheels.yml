name: Downstream Production wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified files as a GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_COMMIT: a6043434d6cd9a2a76553ffdcdf0dda081d9b19c
  SETUPTOOLS_SCM_PRETEND_VERSION: 0.4.0+fatcat.production.1
  RELEASE_TAG: fatcat-production-1

jobs:
  wheels:
    if: github.repository == 'MOVIBALE/neroued_3mf'
    name: ${{ matrix.platform.id }} / Python ${{ matrix.python.version }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {id: linux-x86_64, runner: ubuntu-24.04, arch: x86_64}
          - {id: macos-arm64, runner: macos-14, arch: arm64}
          - {id: windows-amd64, runner: windows-latest, arch: AMD64}
        python:
          - {version: '3.12', tag: '312'}
          - {version: '3.13', tag: '313'}
          - {version: '3.14', tag: '314'}
    steps:
      - uses: actions/checkout@v4
        with:
          path: delivery
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python.version }}
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: C:/vcpkg/installed
          key: production-zlib-${{ runner.os }}-v1
      - name: Build the fixed-source wheel
        uses: pypa/cibuildwheel@v4.3.1
        with:
          package-dir: source
        env:
          CIBW_BUILD: cp${{ matrix.python.tag }}-*
          CIBW_ARCHS: ${{ matrix.platform.arch }}
          CIBW_TEST_SKIP: '*'
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION
      - name: Install and export from the binary wheel
        shell: bash
        run: |
          python -m pip install --only-binary=:all: fatcat-metadata==0.1.0 wheelhouse/*.whl
          python delivery/delivery/export_example.py generated
          python -m fatcat_metadata_examples.minimal --output generated/fatcat-cube.3mf
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.id }}-cp${{ matrix.python.tag }}
          path: wheelhouse/*.whl
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: exports-${{ matrix.platform.id }}-cp${{ matrix.python.tag }}
          path: generated/
          retention-days: 30

  source:
    if: github.repository == 'MOVIBALE/neroued_3mf'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: production-source
          path: dist/*.tar.gz
          retention-days: 30

  publish:
    if: inputs.publish && github.repository == 'MOVIBALE/neroued_3mf'
    needs: [wheels, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: production-source
          path: dist
      - name: Record source and file hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          dist = Path('dist')
          wheels = sorted(dist.glob('*.whl'))
          if len(wheels) != 9:
              raise RuntimeError(f'Expected nine wheels, got {len(wheels)}')
          files = sorted(list(wheels) + list(dist.glob('*.tar.gz')))
          receipt = {
              'version': os.environ['SETUPTOOLS_SCM_PRETEND_VERSION'],
              'source_commit': os.environ['SOURCE_COMMIT'],
              'upstream_commit': '331ac6fa62a719f0dddacf9f005861b187d54f0c',
              'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
          }
          (dist / 'provenance.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          PY
      - name: Publish GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" \
            --title 'Production writer compatibility wheels' \
            --notes-file delivery/RELEASE.md
